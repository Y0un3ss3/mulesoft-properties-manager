name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site

          # Docs at root (mpm.tools.unes.me)
          cp docs/index.html _site/index.html
          cp docs/style.css _site/style.css
          cp docs/favicon.svg _site/favicon.svg
          if [ -d docs/screenshots ]; then
            cp -r docs/screenshots _site/screenshots
          fi

          # Web app at /web (mpm.tools.unes.me/web)
          mkdir -p _site/web
          cp web/index.html _site/web/index.html
          cp web/styles.css _site/web/styles.css
          cp web/app.js _site/web/app.js
          cp web/crypto-js.min.js _site/web/crypto-js.min.js
          cp web/favicon.svg _site/web/favicon.svg

          # SEO files at root
          cp robots.txt _site/robots.txt
          cp sitemap.xml _site/sitemap.xml

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
