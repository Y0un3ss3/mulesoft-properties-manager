name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site

          # Custom domain
          cp CNAME _site/CNAME

          # Web app at root (mpm.tools.unes.me)
          cp web/index.html _site/index.html
          cp web/styles.css _site/styles.css
          cp web/app.js _site/app.js
          cp web/crypto-js.min.js _site/crypto-js.min.js
          cp web/favicon.svg _site/favicon.svg

          # Docs at /docs (mpm.tools.unes.me/docs)
          mkdir -p _site/docs
          cp docs/index.html _site/docs/index.html
          cp docs/style.css _site/docs/style.css
          cp docs/favicon.svg _site/docs/favicon.svg
          if [ -d docs/screenshots ]; then
            cp -r docs/screenshots _site/docs/screenshots
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
