name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build portable exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win

      - name: Rename artifact
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          if ($exe) {
            Rename-Item $exe.FullName "mpm-$version-windows.exe"
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: desktop/release/mpm-*-windows.exe
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate macOS icon (.icns)
        run: node scripts/generate-icns.js

      - name: Build macOS DMG (arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac

      - name: Rename artifact
        run: |
          version=$(node -p "require('./package.json').version")
          dmg=$(find release -name "*.dmg" | head -1)
          if [ -n "$dmg" ]; then
            mv "$dmg" "release/mpm-${version}-macos.dmg"
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop/release/mpm-*-macos.dmg
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 \
            libxtst6 xauth xvfb libgbm-dev libasound2-dev

      - name: Install dependencies
        run: npm ci

      - name: Generate Linux icon (.png)
        run: node scripts/generate-png.js

      - name: Build Linux AppImage
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:linux

      - name: Rename artifact
        run: |
          version=$(node -p "require('./package.json').version")
          appimage=$(find release -name "*.AppImage" | head -1)
          if [ -n "$appimage" ]; then
            mv "$appimage" "release/mpm-${version}-linux.AppImage"
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: desktop/release/mpm-*-linux.AppImage
          retention-days: 30

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: artifacts/macos

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: artifacts/linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*.exe
            artifacts/macos/*.dmg
            artifacts/linux/*.AppImage
          generate_release_notes: true
